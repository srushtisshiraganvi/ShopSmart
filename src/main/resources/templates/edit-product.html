<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Product</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2>Edit Product</h2>
    <form th:action="@{'/update/' + ${product.id}}" th:object="${product}" method="post" class="mt-3">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" th:field="*{name}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Category</label>
            <input type="text" th:field="*{category}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Price (₹)</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Rating</label>
            <input type="number" step="0.1" th:field="*{rating}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Description</label>
            <textarea th:field="*{description}" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="/" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
